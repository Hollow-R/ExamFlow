<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ExamFlow - Sunucuya Bağlan</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #1d2b45;
            background: #f4f6fb;
        }
        * { box-sizing: border-box; }
        body {
            display: grid;
            min-height: 100vh;
            place-items: center;
            margin: 0;
            padding: 24px;
        }
        main {
            width: min(100%, 440px);
            padding: 36px;
            border: 1px solid #e4e8f0;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 12px 36px rgb(29 43 69 / 8%);
        }
        .brand { color: #3156a4; font-size: 24px; font-weight: 700; }
        h1 { margin: 28px 0 8px; font-size: 22px; }
        p { color: #68758a; line-height: 1.55; }
        label { display: block; margin: 24px 0 8px; font-weight: 600; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dce2ed;
            border-radius: 8px;
            font: inherit;
        }
        input:focus { outline: 3px solid rgb(49 86 164 / 18%); border-color: #3156a4; }
        button {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            color: #fff;
            background: #3156a4;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { opacity: .65; cursor: wait; }
        #status { min-height: 24px; margin: 14px 0 0; font-size: 14px; }
        #status.error { color: #a4262c; }
    </style>
</head>
<body>
    <main>
        <div class="brand">ExamFlow</div>
        <h1>Öğretmen sunucusuna bağlanın</h1>
        <p>Öğretmen bilgisayarının yerel IP adresini ve portunu girin. Örnek: http://192.168.1.20:5000</p>
        <form id="connect-form">
            <label for="server-url">Sunucu adresi</label>
            <input id="server-url" name="server-url" type="url" placeholder="http://192.168.1.20:5000" value="__SAVED_SERVER_URL__" required autofocus>
            <button id="connect-button" type="submit">Bağlan</button>
            <p id="status" role="status" aria-live="polite"></p>
        </form>
    </main>
    <script>
        const form = document.getElementById("connect-form");
        const button = document.getElementById("connect-button");
        const status = document.getElementById("status");
        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            button.disabled = true;
            status.className = "";
            status.textContent = "ExamFlow sunucusu kontrol ediliyor...";
            try {
                const result = await pywebview.api.connect(
                    document.getElementById("server-url").value
                );
                if (!result.success) {
                    status.className = "error";
                    status.textContent = result.message;
                    button.disabled = false;
                }
            } catch (error) {
                status.className = "error";
                status.textContent = "Bağlantı başlatılamadı: " + error;
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
